<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JFWMS — WMS Prototype</title>
<style>
:root{
  --blue:#246bfe; --blue2:#4d8cff; --text:#182235; --muted:#697386;
  --bg:#f6f8fc; --line:#e8edf5; --white:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,Arial,sans-serif;color:var(--text);background:#fff;line-height:1.6}
a{text-decoration:none;color:inherit}
.container{width:min(1180px,92%);margin:auto}
header{height:72px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
 position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
.nav{height:100%;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:25px;font-weight:800;letter-spacing:-1px;display:flex;align-items:center}
.logo span{color:var(--blue)}
.logo img{height:32px;display:block}
nav{display:flex;gap:28px;font-size:14px;color:#4c5668}nav a:hover{color:var(--blue)}
.actions{display:flex;align-items:center;gap:12px}.lang{font-size:14px}.login{color:#4c5668}
.menu-toggle{display:none}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:8px;order:5}
.hamburger span{width:22px;height:2px;background:var(--text);border-radius:2px;display:block;transition:.2s}
.nav-login{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;border-radius:8px;
 background:var(--blue);color:#fff;font-weight:700;font-size:14px;border:0;cursor:pointer}
.btn.light{background:#edf3ff;color:var(--blue)}
.hero{min-height:620px;background:radial-gradient(circle at 75% 25%,#dfeaff 0,transparent 34%),
 linear-gradient(135deg,#f7faff,#eef4ff);display:flex;align-items:center}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:55px;align-items:center}
.eyebrow{display:inline-block;padding:7px 12px;border-radius:20px;background:#e7efff;color:var(--blue);
 font-size:13px;font-weight:700;margin-bottom:20px}
h1{font-size:54px;line-height:1.12;letter-spacing:-2px;margin-bottom:22px}
h1 span{color:var(--blue)}.hero p{font-size:18px;color:var(--muted);max-width:600px;margin-bottom:30px}
.hero-buttons{display:flex;gap:12px}
.dashboard{height:365px;border-radius:20px;background:#fff;box-shadow:0 25px 70px rgba(34,72,140,.16);
 border:1px solid #e9eef7;padding:18px;transform:rotate(1deg)}
.dash-top{height:35px;display:flex;gap:7px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:#d6deeb}
.dash-body{display:grid;grid-template-columns:120px 1fr;gap:14px;height:290px}
.sidebar{background:#f4f7fc;border-radius:10px;padding:12px}.side-line{height:10px;background:#dfe7f3;border-radius:5px;margin-bottom:14px}
.panel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat,.chart{background:#f7f9fc;border-radius:10px;padding:12px 13px}.stat{height:92px;display:flex;flex-direction:column;justify-content:space-between}
.stat-top{display:flex;align-items:center;justify-content:space-between}
.stat-top small{color:var(--muted)}
.trend{font-size:11px;font-weight:700;padding:2px 6px;border-radius:20px}
.trend.up{color:#16a34a;background:#e9f9ee}.trend.down{color:#dc2626;background:#fdecec}
.stat b{display:block;font-size:19px;color:var(--text)}
.spark{width:100%;height:22px;display:block}
.spark polyline{fill:none;stroke:var(--blue);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.spark.down polyline{stroke:#f0784f}
.chart{grid-column:span 3;height:190px;position:relative;overflow:hidden}
.chart svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:150px}
section{padding:90px 0}.gray{background:var(--bg)}
.section-head{text-align:center;max-width:720px;margin:0 auto 50px}.section-head h2{font-size:36px;line-height:1.2;margin-bottom:12px}
.section-head p{color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;transition:.25s}
.card:hover{transform:translateY(-5px);box-shadow:0 15px 35px rgba(20,50,100,.08)}
.icon{width:48px;height:48px;border-radius:12px;background:#edf3ff;color:var(--blue);display:grid;place-items:center;font-size:23px;margin-bottom:20px}
.card h3{font-size:19px;margin-bottom:9px}.card p{color:var(--muted);font-size:14px}
.scenarios{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.scenario{min-height:260px;border-radius:18px;padding:34px;color:#fff;position:relative;overflow:hidden}
.scenario:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-55px;bottom:-70px;background:rgba(255,255,255,.12)}
.scenario.blue{background:linear-gradient(135deg,#246bfe,#66a0ff)}.scenario.dark{background:linear-gradient(135deg,#1e293b,#42516b)}
.scenario h3{font-size:25px;margin-bottom:12px}.scenario ul{list-style:none;opacity:.92}.scenario li{margin:8px 0}.scenario li:before{content:"✓";margin-right:9px}
.features{display:grid;grid-template-columns:.85fr 1.3fr;gap:70px;align-items:start}
.feature-visual{background:linear-gradient(145deg,#edf4ff,#fff);border:1px solid var(--line);border-radius:20px;padding:30px;position:sticky;top:100px}
.visual-frame{position:relative}
.visual-frame:before{content:"";position:absolute;inset:-30px -30px auto -30px;height:75%;
 background:radial-gradient(60% 60% at 50% 20%,rgba(36,107,254,.22),transparent 70%);z-index:0;filter:blur(6px);pointer-events:none}
.app-window{position:relative;z-index:1;background:#fff;border-radius:14px;box-shadow:0 25px 55px rgba(20,50,110,.22);border:1px solid #e9eef7;overflow:hidden}
.app-window .app-bar{height:34px;background:#f4f7fc;display:flex;align-items:center;gap:6px;padding:0 14px;border-bottom:1px solid var(--line)}
.app-window .app-bar i{width:9px;height:9px;border-radius:50%;background:#d6deeb;display:block}
.app-window img{width:100%;display:block}
.app-window svg{width:100%;height:auto;display:block}
.live-badge{position:absolute;z-index:2;top:-14px;right:14px;background:#fff;border:1px solid var(--line);border-radius:30px;
 padding:8px 16px 8px 12px;font-size:13px;font-weight:700;color:var(--text);box-shadow:0 10px 24px rgba(20,50,100,.14);
 display:flex;align-items:center;gap:7px}
.live-badge .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.feature-caption{margin-top:16px;font-size:13px;color:var(--muted);text-align:center}
.feature-window{background:#fff;border-radius:14px;box-shadow:0 15px 35px rgba(30,60,100,.1);padding:20px}
.row{height:14px;background:#edf1f7;border-radius:7px;margin:12px 0}.row.short{width:55%}.row.blue{background:#9fc0ff;width:78%}
.feature-list{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.feature-item{display:flex;flex-direction:column;gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;transition:.25s}
.feature-item:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(20,50,100,.09)}
.feature-illus{width:100%;height:96px;border-radius:12px;background:linear-gradient(150deg,#eef4ff,#f8fbff);display:flex;align-items:center;justify-content:center;overflow:hidden}
.feature-illus svg{width:100%;height:100%}
.feature-text{display:flex;gap:14px}
.feature-item .num{width:30px;height:30px;flex:none;border-radius:50%;background:#e9f0ff;color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:13px}
.feature-item h3{font-size:16px;margin-bottom:3px}.feature-item p{font-size:13.5px;color:var(--muted);line-height:1.5}
.platforms{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;max-width:1080px;margin:auto}
.platform{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 14px;font-size:16px;font-weight:800;letter-spacing:-.3px;
 box-shadow:0 5px 15px rgba(30,50,90,.04);display:flex;align-items:center;justify-content:center;text-align:center;min-height:78px;transition:.25s;color:#33415c}
.platform:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(20,50,100,.1)}
.platform b{font-weight:900}
@media(max-width:850px){.platforms{grid-template-columns:repeat(3,1fr)}}
@media(max-width:520px){.platforms{grid-template-columns:repeat(2,1fr)}}
.cases{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.case{background:#fff;border-radius:15px;overflow:hidden;border:1px solid var(--line)}
.case-img{height:150px;background:linear-gradient(135deg,#dbe8ff,#f3f7ff);display:grid;place-items:center;font-size:42px}
.case-body{padding:23px}.case-body h3{margin-bottom:8px}.case-body p{color:var(--muted);font-size:14px}
.cta{background:linear-gradient(120deg,#1e62ef,#4e8cff);color:#fff;border-radius:24px;padding:65px;text-align:center}
.cta h2{font-size:38px;margin-bottom:12px}.cta p{opacity:.9;margin-bottom:25px}.cta .btn{background:#fff;color:var(--blue)}
footer{background:#101827;color:#b9c2d1;padding:55px 0 25px}.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px}
footer .logo{color:#fff}
footer h3{color:#fff;margin-bottom:15px}footer a{display:block;margin:8px 0;font-size:14px}footer a:hover{color:#fff}.copyright{border-top:1px solid #263143;margin-top:40px;padding-top:20px;font-size:13px}
@media(max-width:850px){
 nav,.login{display:none}.hero-grid,.features{grid-template-columns:1fr}.feature-list{grid-template-columns:1fr}.feature-visual{position:static}.hero{padding:70px 0}.hero h1{font-size:40px}.cards,.cases{grid-template-columns:1fr}.scenarios{grid-template-columns:1fr}.footer-grid{grid-template-columns:1fr 1fr}.dashboard{transform:none}
}
@media(max-width:520px){.actions .lang{display:none}.hero-buttons{flex-direction:column}.hero-buttons .btn{width:100%}.cta{padding:40px 22px}.cta h2{font-size:30px}}
</style>
</head>
